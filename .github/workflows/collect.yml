name: Collect local info

# 情報源（collector/sources.json）から新着情報を取得し、data/collected/ を main に直接コミットする。
# コミット後は deploy.yml（workflow_run）がサイトを再デプロイする。
on:
  schedule:
    - cron: '47 21 * * *' # 毎日 6:47（JST）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: collect
        run: node collector/collect.mjs

      - name: Commit collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data/collected
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m '新着情報を取得 (${{ steps.collect.outputs.new_count }}件)'
          git pull --rebase origin main
          git push origin HEAD:main
